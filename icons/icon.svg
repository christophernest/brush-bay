<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fdcef"/><stop offset=".55" stop-color="#1f86b8"/><stop offset="1" stop-color="#0b4f7a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fc0"/><stop offset="1" stop-color="#e2558f"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sea)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- light rays -->
  <g fill="#fff" opacity=".08">
    <path d="M300 0 L380 0 L250 700 L180 700 Z"/><path d="M560 0 L620 0 L560 640 L500 640 Z"/><path d="M800 0 L880 0 L900 600 L840 600 Z"/>
  </g>
  <!-- the bay: sand at the bottom -->
  <path d="M0 860 C 200 800, 420 830, 560 860 C 720 895, 880 870, 1024 830 V1024 H0 Z" fill="#f6e7c8"/>
  <!-- one brush stroke (横, the first stroke she learns), painted by the stingray's tail -->
