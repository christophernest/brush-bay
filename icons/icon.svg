    <path d="M470 708 C 540 703, 600 698, 660 692" stroke-width="3.5"/>
    <path d="M560 693 C 610 689, 650 684, 700 678" stroke-width="2.5"/>
  </g>
  <!-- bubbles -->
  <g fill="none" stroke="#fff" stroke-opacity=".8">
    <circle cx="810" cy="210" r="36" stroke-width="10"/><circle cx="876" cy="320" r="20" stroke-width="8"/>
  </g>
  <!-- the stingray, gliding above the stroke -->
  <g transform="translate(512 410) rotate(-6) scale(3.1) translate(-100 -66)">
    <path d="M100 108 C 104 124, 96 140, 76 152" stroke="#d94d8f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M100 18 C 135 26, 178 52, 196 74 C 172 86, 132 96, 100 112 C 68 96, 28 86, 4 74 C 22 52, 65 26, 100 18 Z" fill="url(#ray)"/>
    <path d="M100 30 C 125 38, 150 56, 160 70 C 140 78, 118 86, 100 96 C 82 86, 60 78, 40 70 C 50 56, 75 38, 100 30 Z" fill="#ff9fca"/>
    <circle cx="86" cy="54" r="9" fill="#fff"/><circle cx="114" cy="54" r="9" fill="#fff"/>
    <circle cx="88" cy="56" r="4.5" fill="#2f2346"/><circle cx="116" cy="56" r="4.5" fill="#2f2346"/>
    <circle cx="90" cy="54" r="1.6" fill="#fff"/><circle cx="118" cy="54" r="1.6" fill="#fff"/>
    <ellipse cx="74" cy="68" rx="7" ry="4" fill="#ff6fa8" opacity=".6"/><ellipse cx="126" cy="68" rx="7" ry="4" fill="#ff6fa8" opacity=".6"/>
    <path d="M90 72 Q 100 80 110 72" stroke="#2f2346" stroke-width="3" fill="none" stroke-linecap="round"/>
